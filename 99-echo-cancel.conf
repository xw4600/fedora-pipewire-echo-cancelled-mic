## Echo cancellation so the mic doesn't pick up speaker output.
##
## monitor.mode = true: the AEC takes its reference signal by tapping the
## monitor of the default speaker output, so apps keep playing to the normal
## default sink and don't need to be routed through this module.
##
## Result: "echo-cancel-source" = USB mic with speaker echo removed.
context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      # webrtc AEC is the default; named explicitly since aec.method is deprecated
      library.name = "aec/libspa-aec-webrtc"
      aec.args = "analog_gain_control=false digital_gain_control=false"
      monitor.mode = true

      # Pin capture to the USB mic
      capture.props = {
        node.target = "alsa_input.usb-0c76_USB_PnP_Audio_Device-00.mono-fallback"
      }

      # Reference: tap the monitor of the motherboard speaker output
      sink.props = {
        node.name = "echo-cancel-reference"
        node.description = "Echo Cancel Reference"
        node.target = "alsa_output.pci-0000_c6_00.6.analog-stereo.monitor"
      }

      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Echo Cancelled Source"
        node.virtual = true
        media.class = "Audio/Source"
        audio.position = "MONO"
      }
    }
  }
]
